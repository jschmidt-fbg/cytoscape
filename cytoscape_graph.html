<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Lineage Graph - Vis.js</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/peer/vis-network.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #2b2b2b;
      color: white;
    }
    #network {
      width: 100%;
      height: 100vh;
      border: 1px solid lightgray;
    }
  </style>
</head>
<body>
  <div id="network"></div>
  <script type="text/javascript">
    // Netzwerkinformationen laden
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        var nodes = new vis.DataSet(data.nodes);
        var edges = new vis.DataSet(data.edges);

        // Netzwerkoptionen
        var options = {
          nodes: {
            shape: 'box',
            font: { color: '#ffffff', size: 14 },
            color: {
              background: '#ff6600',
              border: '#cc5200',
            },
            borderWidth: 2,
            widthConstraint: { maximum: 200 }
          },
          edges: {
            color: '#ffffff',
            arrows: {
              to: { enabled: true, scaleFactor: 1.5 },
            },
            smooth: { type: 'continuous' }
          },
          layout: {
            hierarchical: {
              direction: 'UD',  // Von oben nach unten
              levelSeparation: 100,
              nodeSpacing: 150,
              treeSpacing: 200
            }
          },
          interaction: {
            hover: true,
            tooltipDelay: 200,
          },
          physics: {
            enabled: false, // Deaktiviert physikalische Bewegung
          },
          manipulation: {
            enabled: true, // Aktiviert Bearbeitung
          },
          configure: {
            enabled: true,
            filter: 'nodes',
          },
        };

        var container = document.getElementById('network');
        var network = new vis.Network(container, { nodes: nodes, edges: edges }, options);

        // Kollapsen und Expandieren von Knoten
        network.on("selectNode", function (params) {
          var selectedNodeId = params.nodes[0];
          let selectedNode = nodes.get(selectedNodeId);

          // Überprüfen, ob der Knoten expandiert oder kollabiert werden soll
          if (selectedNode.collapsed) {
            selectedNode.collapsed = false;
            network.setData({ nodes: nodes, edges: edges });
          } else {
            selectedNode.collapsed = true;
            network.setData({ nodes: nodes, edges: edges });
          }
        });
      });
  </script>
</body>
</html>
